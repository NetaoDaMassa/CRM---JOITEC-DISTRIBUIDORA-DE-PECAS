# Nome fixo do projeto → prefixa containers/volumes/redes como "joitec-crm_*",
# independente do nome da pasta no VPS. Garante que NÃO colida com o Odin CRM
# (que roda no mesmo servidor com seus próprios volumes/containers).
name: joitec-crm

services:
  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/joitec_crm.db
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 3001
      UPLOADS_DIR: /app/uploads
      CLIENT_URL: ${CLIENT_URL:-*}
      # Opcional — extração de itens do PDF do pedido via IA. Se vazio, o recurso
      # de extração automática fica desabilitado (o resto do CRM funciona normal).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Opcional — integração GoTo Connect (registro automático de ligações).
      # Se vazio, o botão "Conectar com a GoTo" em Configurações fica
      # indisponível, mas o resto do CRM funciona normal.
      GOTO_CLIENT_ID: ${GOTO_CLIENT_ID:-}
      GOTO_CLIENT_SECRET: ${GOTO_CLIENT_SECRET:-}
      GOTO_REDIRECT_URI: ${GOTO_REDIRECT_URI:-}
      # Opcional — ponte com o CRM de marketing (odin-tubos-crm) pro slide
      # "Leads aguardando" do Painel de TV. Se vazio, o slide some sozinho.
      MARKETING_CRM_URL: ${MARKETING_CRM_URL:-}
      MARKETING_CRM_API_KEY: ${MARKETING_CRM_API_KEY:-}
    volumes:
      - db_data:/app/data
      - uploads:/app/uploads
    expose:
      - "3001"
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      internal: {}
      # Rede compartilhada com o Caddy do projeto-leads (o mesmo que já serve o
      # Odin CRM). O Caddy encontra este container pelo alias "joitec-frontend".
      web:
        aliases:
          - joitec-frontend

networks:
  internal:
  # Criada uma única vez no VPS:  docker network create web
  # (provavelmente já existe, pois o Odin CRM também a usa).
  web:
    external: true

volumes:
  db_data:
  uploads:
