services:
  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/odin_crm.db
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 3001
      UPLOADS_DIR: /app/uploads
      CLIENT_URL: ${CLIENT_URL:-*}
    volumes:
      - db_data:/app/data
      - uploads:/app/uploads
    expose:
      - "3001"
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      internal: {}
      # Rede compartilhada com o Caddy do outro projeto (projeto-leads).
      # O Caddy encontra este container pelo alias "crm-frontend".
      web:
        aliases:
          - crm-frontend

networks:
  internal:
  # Criada uma única vez no VPS:  docker network create web
  web:
    external: true

volumes:
  db_data:
  uploads:
