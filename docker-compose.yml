version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: odin_crm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: odin_root_2024
      MYSQL_DATABASE: odin_crm
      MYSQL_USER: odin_user
      MYSQL_PASSWORD: Odin@DB2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    name: odin_crm_mysql_data
