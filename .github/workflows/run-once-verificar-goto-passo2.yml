name: Run once — Verificar GoTo PASSO 2 pós-deploy

# ⚠️ TEMPORÁRIO — só leitura, roda o script compilado que lê
# goto_log_integracao e goto_ligacoes_processadas pra investigar uma
# ligação de teste real. Apagar depois de usar.

on:
  workflow_dispatch:

jobs:
  verificar:
    name: Rodar na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e rodar script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            docker compose exec -T backend node dist/scriptsOnetime/verificarGotoPasso2.js
