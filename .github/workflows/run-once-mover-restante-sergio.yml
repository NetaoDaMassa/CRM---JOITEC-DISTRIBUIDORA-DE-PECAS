name: Run once — Mover clientes restantes do Sergio (Odin Tubos)

# ⚠️ TEMPORÁRIO — termina a movimentação que ficou pela metade numa
# tentativa anterior (SSH caiu no meio). Idempotente. Apagar depois.

on:
  workflow_dispatch:

jobs:
  run-script:
    name: Rodar script na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e rodar o script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            docker compose exec -T backend node dist/scriptsOnetime/moverRestanteSergio.js
