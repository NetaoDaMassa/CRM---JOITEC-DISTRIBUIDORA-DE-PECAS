name: Run once — Diagnóstico erro conexão GoTo

# ⚠️ TEMPORÁRIO — só leitura, pega os logs recentes do backend filtrados
# por "goto" pra investigar a falha de conexão. Apagar depois.

on:
  workflow_dispatch:

jobs:
  diag:
    name: Rodar na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e pegar logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            echo "===== logs do backend (últimas 200 linhas, filtro goto) ====="
            docker compose logs --tail=200 backend 2>&1 | grep -i "goto" | tail -80
