name: Run once — Diagnóstico erro conexão GoTo (2)

# ⚠️ TEMPORÁRIO — só leitura, confirma se users.v1.read resolveu o 403 do
# accountKey. Apagar depois.

on:
  workflow_dispatch:

jobs:
  diag:
    name: Rodar na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e pegar logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            echo "===== logs do backend (últimas 100 linhas, filtro goto) ====="
            docker compose logs --tail=100 backend 2>&1 | grep -i "goto" | tail -40
