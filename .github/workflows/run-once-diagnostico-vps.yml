name: Run once — Diagnóstico VPS (site fora do ar)

# ⚠️ TEMPORÁRIO — só roda comandos de leitura (docker ps, logs, df -h) pra
# descobrir por que https://joitec-crm.duckdns.org está com erro de TLS.
# Não mexe em nada. Apagar depois de diagnosticado.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    name: Rodar diagnóstico na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e checar status
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "===== docker ps (todos os containers) ====="
            docker ps -a
            echo
            echo "===== espaço em disco ====="
            df -h
            echo
            echo "===== onde o Caddy roda de verdade ====="
            CADDY_DIR=$(docker inspect odin-crm-caddy-1 --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')
            echo "pasta: $CADDY_DIR"
            echo
            echo "===== logs recentes do Caddy (só o que menciona joitec ou erro/cert) ====="
            cd "$CADDY_DIR" && docker compose logs --tail=300 caddy 2>&1 | grep -i "joitec\|error\|cert\|tls" | tail -60
            echo
            echo "===== Caddyfile (bloco joitec, se existir) ====="
            find "$CADDY_DIR" -iname "Caddyfile*" -exec grep -l "joitec" {} \; -exec cat {} \;
