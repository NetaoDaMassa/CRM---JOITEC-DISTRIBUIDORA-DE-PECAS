name: Run once — Diagnóstico VPS (site fora do ar)

# ⚠️ TEMPORÁRIO — diagnosticou que o Caddyfile do projeto odin-crm (Caddy
# compartilhado) não tem bloco pro domínio do Joitec. Este run ADICIONA o
# bloco e recarrega o Caddy (graceful reload — não reinicia o container,
# não derruba os outros sites que ele serve). Apagar depois de confirmado.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    name: Rodar diagnóstico na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e checar status
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "===== docker ps (todos os containers) ====="
            docker ps -a
            echo
            echo "===== espaço em disco ====="
            df -h
            echo
            echo "===== onde o Caddy roda de verdade ====="
            CADDY_DIR=$(docker inspect odin-crm-caddy-1 --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')
            echo "pasta: $CADDY_DIR"

            if grep -q "joitec-crm.duckdns.org" "$CADDY_DIR/Caddyfile"; then
              echo "Bloco do joitec já existe no Caddyfile, não vou duplicar."
            else
              echo "===== adicionando bloco do joitec ao Caddyfile ====="
              cp "$CADDY_DIR/Caddyfile" "$CADDY_DIR/Caddyfile.bak-fix-joitec-$(date +%Y%m%d%H%M%S)"
              printf '\njoitec-crm.duckdns.org {\n\tencode gzip\n\treverse_proxy joitec-frontend:80\n}\n' >> "$CADDY_DIR/Caddyfile"
              echo "--- Caddyfile atualizado ---"
              cat "$CADDY_DIR/Caddyfile"
            fi

            echo
            echo "===== recarregando Caddy (graceful reload, sem restart) ====="
            cd "$CADDY_DIR" && docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
            echo
            echo "===== aguardando emissão do certificado ====="
            sleep 8
            docker compose logs --tail=20 caddy | grep -i "joitec" || echo "(ainda sem log — pode levar mais alguns segundos)"
