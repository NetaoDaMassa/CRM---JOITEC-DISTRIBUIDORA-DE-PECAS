name: Run once — Diagnóstico VPS (site fora do ar)

# ⚠️ TEMPORÁRIO — só roda comandos de leitura (docker ps, logs, df -h) pra
# descobrir por que https://joitec-crm.duckdns.org está com erro de TLS.
# Não mexe em nada. Apagar depois de diagnosticado.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    name: Rodar diagnóstico na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e checar status
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "===== docker ps (todos os containers) ====="
            docker ps -a
            echo
            echo "===== espaço em disco ====="
            df -h
            echo
            echo "===== logs recentes do Caddy (projeto-leads) ====="
            cd ~/projeto-leads 2>/dev/null && docker compose logs --tail=60 caddy 2>&1 || echo "pasta projeto-leads não encontrada em ~/projeto-leads"
            echo
            echo "===== status do CRM Joitec ====="
            cd "${{ secrets.VPS_PROJECT_PATH }}" && docker compose ps
            echo
            echo "===== logs recentes do backend Joitec ====="
            docker compose logs --tail=30 backend
