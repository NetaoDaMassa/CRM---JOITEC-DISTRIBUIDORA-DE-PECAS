name: Deploy CRM Joitec

on:
  workflow_dispatch:

concurrency:
  group: deploy-joitec-crm
  cancel-in-progress: true

jobs:
  deploy:
    name: Atualizar CRM Joitec na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e atualizar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            echo ">> Buscando atualizações..."
            # "git pull" sozinho depende de qual branch/tracking já estava checado na
            # VPS — se algum dia divergiu (branch errado, commit local solto etc.), ele
            # pode reportar "up to date" sem realmente atualizar nada. fetch + checkout +
            # reset --hard força a VPS a ficar EXATAMENTE igual ao "main" do GitHub,
            # sempre, não importa o que estava checado antes.
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo ">> Rebuild e restart dos containers..."
            docker compose up -d --build
            echo ">> Limpando imagens antigas..."
            docker image prune -f
            echo ">> Deploy concluído!"
