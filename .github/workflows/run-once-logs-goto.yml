name: Run once — Logs brutos do backend filtrados por goto

# ⚠️ TEMPORÁRIO — só leitura. Apagar depois de usar.

on:
  workflow_dispatch:

jobs:
  logs:
    name: Rodar na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VPS e pegar logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            echo "===== logs do backend (últimas 500 linhas, filtro goto) ====="
            docker compose logs --tail=500 backend 2>&1 | grep -i "goto" | tail -150
