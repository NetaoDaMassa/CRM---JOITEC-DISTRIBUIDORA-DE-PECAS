server {
    listen 80;
    server_name _;

    # Permite uploads maiores — a maioria dos anexos (leads, devolução, ordens)
    # tem limite de 15-20 MB no backend, mas os arquivos de Marketing (fotos/
    # vídeos/PDFs em Arquivos/Mídia) vão até 300 MB (ver uploadMarketing em
    # server/src/index.ts). Sem isso o nginx corta a requisição ANTES dela
    # chegar no backend e devolve uma página de erro HTML (413) em vez de
    # JSON — é o que causava "Unexpected token '<' ... is not valid JSON" ao
    # tentar subir um PDF/vídeo maior que 25 MB (achado do João, 2026-09-04).
    client_max_body_size 320M;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca fica em cache — ele referencia os arquivos JS/CSS
    # pelo nome com hash do build; se o navegador guardasse um index.html
    # velho, ficaria preso numa versão antiga do app até um hard refresh
    # manual (foi exatamente o que aconteceu: alguém viu o modal de "venda
    # rápida" sem os campos novos porque o index.html estava em cache).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # JS/CSS do build têm hash no nome (ex: index-Ab12Cd34.js) — o conteúdo
    # nunca muda pra um nome já existente, então pode cachear "pra sempre"
    # sem risco de servir versão desatualizada.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Script de rastreamento de leads, embutido nos sites do grupo via
    # <script src=".../tracker.js"> → backend. Precisa de "location exata"
    # (=) porque senão cai no bloco de cache de .js/.css logo acima (que
    # bate primeiro por ser regex) e tenta servir como arquivo estático do
    # build do CRM, que não existe (dava 404).
    location = /tracker.js {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API tRPC → backend
    location /trpc/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Callback do OAuth da GoTo Connect (e outras rotas simples fora do tRPC) → backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload de anexos (multipart) → backend
    location /upload/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos enviados (download) → backend
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
