server {
    listen 80;
    server_name _;

    # Permite uploads maiores (anexos de leads — limite do backend é 20 MB).
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca fica em cache — ele referencia os arquivos JS/CSS
    # pelo nome com hash do build; se o navegador guardasse um index.html
    # velho, ficaria preso numa versão antiga do app até um hard refresh
    # manual (foi exatamente o que aconteceu: alguém viu o modal de "venda
    # rápida" sem os campos novos porque o index.html estava em cache).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # JS/CSS do build têm hash no nome (ex: index-Ab12Cd34.js) — o conteúdo
    # nunca muda pra um nome já existente, então pode cachear "pra sempre"
    # sem risco de servir versão desatualizada.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API tRPC → backend
    location /trpc/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Callback do OAuth da GoTo Connect (e outras rotas simples fora do tRPC) → backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload de anexos (multipart) → backend
    location /upload/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos enviados (download) → backend
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
